<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>O’Hazi38</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style id="css">
:root{--c1:#D92D20;--c2:#FFB800;--bg:#FBFAF8;--cd:#fff;--tx:#1B1A18;--mu:#6F6A63;--ln:#E7E4DE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151412;--cd:#211F1C;--tx:#F3F1EC;--mu:#A39E96;--ln:#34312C;color-scheme:dark}}
:root[data-theme=dark]{--bg:#151412;--cd:#211F1C;--tx:#F3F1EC;--mu:#A39E96;--ln:#34312C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 'Bricolage Grotesque',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgi,none) center/cover}
img,video{max-width:100%}h2{font-size:22px;margin:24px 0 10px}h3{font-size:17px;margin:18px 0 6px}
.w{max-width:560px;margin:0 auto;padding:0 16px 96px}.aw{max-width:920px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0}.aw .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.lg{display:flex;align-items:center;gap:12px;font-size:22px;line-height:1.1;min-width:0}.lg b{min-width:0;overflow-wrap:anywhere}.lg img{width:72px;height:72px;border-radius:16px;object-fit:contain;flex:none}.lg .em{font-size:56px;line-height:1}
.b{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:var(--c1);color:#fff;cursor:pointer}.b:disabled{opacity:.4;cursor:not-allowed}
.b2{background:var(--cd);color:var(--tx);border:1px solid var(--ln)}.bs{padding:7px 11px;font-size:14px;border-radius:9px}
.lk{background:none;border:0;color:var(--mu);text-decoration:underline;font:inherit;cursor:pointer}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;margin-top:6px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--tx)}
input[type=color]{height:42px;padding:3px}input[type=checkbox],input[type=radio]{width:auto;margin:0}input.bad{border-color:#D92D20;outline:1px solid #D92D20}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin-top:10px}label.ck{display:flex;align-items:center;gap:8px;font-weight:400;margin:6px 0;font-size:16px}.ck span{margin-left:auto}
.hero{border-radius:20px;padding:24px 20px;color:#fff;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 55%,#000)) center/cover}
.hero h1{font-size:clamp(26px,7vw,38px);line-height:1.1;margin:0 0 16px;font-weight:800;text-wrap:balance}.hero .b{align-self:flex-start;background:var(--c2);color:#1B1A18}
.inf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.inf>div,.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.cd{margin:10px 0;display:grid;gap:6px}details{margin:6px 0}summary{cursor:pointer;color:var(--mu)}
.rw{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.ch{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);white-space:nowrap;cursor:pointer;font:inherit;font-weight:600}.ch.on{background:var(--tx);color:var(--bg)}
.pr{flex:0 0 auto;background:var(--c2);color:#1B1A18;border-radius:14px;padding:12px 16px;display:grid}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:10px}.pc{background:var(--cd);border:1px solid var(--ln);border-radius:16px;overflow:hidden;cursor:pointer}.pi{padding:10px 12px}
.ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:44px;background:color-mix(in srgb,var(--c2) 35%,var(--bg)) center/cover}.ph.sm{width:52px;height:52px;flex:none;border-radius:10px;font-size:26px;aspect-ratio:auto}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px}.sl>*{flex:0 0 100%;width:100%;scroll-snap-align:center;aspect-ratio:4/3;object-fit:cover;border-radius:14px}
.mu{color:var(--mu)}.pp{font-size:22px;color:var(--c1)}.num{font-size:44px;font-weight:800;color:var(--c1);margin:0}
.wn{background:color-mix(in srgb,var(--c2) 30%,var(--bg));border-radius:12px;padding:10px 12px;font-weight:600}
.rt{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.rt label{margin:0}.rt input,.rt select{min-width:0}.qt{display:flex;align-items:center;gap:8px}
.tt{display:flex;justify-content:space-between;padding:4px 0}.tt.big{font-size:19px;border-top:1px solid var(--ln);margin-top:6px;padding-top:8px}
.t3{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:8px;padding:4px 0;font-size:14px}.st{font-size:12px;font-weight:700;color:var(--mu)}.st.on{color:#1E9E57}
.tx{margin-top:22px;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px 16px}.tx h2{margin:0 0 6px}.tx p{margin:0;white-space:pre-line}
.th{position:relative;flex:0 0 72px;height:72px;border-radius:10px;background:center/cover}.th button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sh{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px))}.cl{margin-top:14px;width:100%}
.fab{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;z-index:6;display:flex;justify-content:space-between}
.ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;max-width:90%}
.hero{color:var(--ht,#fff)}.hero .b,.pr{color:var(--c2t,#1B1A18)}.pc.out{opacity:.5}.pw{flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin:2px 0 20px}.brand b{font-size:clamp(26px,7vw,34px);line-height:1.1;font-weight:800;overflow-wrap:anywhere}
.brand img,.brand .em{width:clamp(136px,40vw,176px);aspect-ratio:1;border-radius:50%;object-fit:cover;background:#fff;border:5px solid var(--c1);box-shadow:0 0 0 5px var(--bg),0 10px 30px rgba(0,0,0,.25)}.brand .em{display:grid;place-items:center;background:var(--c1);color:#fff;font-weight:800;line-height:1;font-size:clamp(64px,18vw,84px)}
